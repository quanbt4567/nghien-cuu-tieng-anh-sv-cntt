name: Build SpeakIT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "Quân"
      - "main"
    paths:
      - "speakit-android/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Capacitor dependencies & sync Android
        working-directory: speakit-android
        run: |
          npm install
          npx cap sync android

      - name: Decode google-services.json (if secret configured)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > speakit-android/android/app/google-services.json

      - name: Build Debug APK
        working-directory: speakit-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload SpeakIT-Android.apk
        uses: actions/upload-artifact@v4
        with:
          name: SpeakIT-Android-APK
          path: speakit-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
